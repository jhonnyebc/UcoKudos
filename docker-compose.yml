# Entorno local de UcoKudos (ADR-0016). Misma topología que producción; lo que cambia es la configuración.
#
#   postgres        Base de datos única (ADR-0003)
#   objetos         Almacenamiento de adjuntos compatible con S3 (ADR-0012)
#   mailpit         Captura el correo en local: nada sale a internet (ADR-0008)
#   observabilidad  Recibe trazas, métricas y logs por OTLP (ADR-0014)
#
# Las contraseñas se leen de .env, que no se versiona (ADR-0018).
# Los puertos del host están elegidos para no chocar con otros entornos locales del autor.
services:
  postgres:
    image: postgres:18.2-alpine
    container_name: ucokudos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:?Define POSTGRES_USUARIO en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_BD:-ucokudos}
    ports:
      - "${POSTGRES_PUERTO:-5435}:5432"
    volumes:
      - ucokudos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adjuntos (ADR-0012): contenedor PRIVADO. La API firma URL de vida corta; no hay lectura anónima.
  #
  # No es MinIO, y conviene saber por qué: MinIO cerró sus imágenes públicas, tanto las propias de
  # quay.io como las de Bitnami, así que ya no se pueden descargar sin credenciales. Está anotado
  # como revisión del 2026-11-09 en ADR-0012, porque cambia el SBB elegido.
  #
  # Esta implementación habla la API de S3, que es lo único de lo que depende el adaptador, y es la
  # **misma** que usan las pruebas de integración, así que el entorno local y las pruebas verifican
  # contra lo mismo (factor X de los doce). El almacenamiento de producción se decide en la Fase 4,
  # con el despliegue.
  #
  # Se eligió esta y no otra por una razón concreta: comprueba las firmas y hace cumplir la
  # caducidad de las URL prefirmadas. La alternativa que se probó primero servía cualquier objeto sin
  # firma, de modo que las pruebas de seguridad de los adjuntos no habrían comprobado nada.
  #
  # El contenedor de adjuntos no se crea aquí: lo crea la aplicación al arrancar, y así queda uno
  # solo creándolo, de la misma forma en local y en el servidor.
  objetos:
    image: localstack/localstack:4.9
    container_name: ucokudos-objetos
    restart: unless-stopped
    environment:
      SERVICES: s3
      # Que el servidor compruebe las firmas, como lo haría el de producción. Con esto desactivado
      # el entorno local aceptaría peticiones mal firmadas y los errores aparecerían al desplegar.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      # Solo en el equipo local: en producción no se publica a internet (ADR-0016).
      - "127.0.0.1:9000:4566"
    volumes:
      - ucokudos-objetos:/var/lib/localstack

  # Correo atrapado en local (ADR-0008): interfaz en http://localhost:8026, SMTP en 1025.
  # Permite revisar el HTML tal como lo verá el destinatario sin gastar cuota ni escribir a nadie.
  mailpit:
    image: axllent/mailpit:v1.27.7
    container_name: ucokudos-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1025:1025"

  # Observabilidad local (ADR-0014): recibe por OTLP las trazas, métricas y logs de la API.
  # Solo escucha en el equipo local y no persiste nada: muestra datos internos del sistema.
  # El archivo histórico es la auditoría (ADR-0013), que sí persiste en PostgreSQL.
  observabilidad:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    container_name: ucokudos-observabilidad
    restart: unless-stopped
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${OBSERVABILIDAD_PUERTO:-18890}:18888"
      - "127.0.0.1:4317:18889"

  # La API, en contenedor también en local (ADR-0016).
  #
  # No es solo por paridad con producción, que ya sería razón suficiente: en el equipo de
  # desarrollo **no se puede ejecutar de otra forma**. Smart App Control bloquea la carga de los
  # ensamblados recién compilados, así que `dotnet run` muere al arrancar con
  # «An Application Control policy has blocked this file (0x800711C7)». Es lo mismo que obliga a
  # correr las pruebas y las migraciones en contenedor.
  #
  # Los nombres de servicio sustituyen a localhost: dentro de la red de Docker, la base es
  # `postgres` y no `localhost`. Es el error más fácil de cometer al pasar de uno a otro.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucokudos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_BD:-ucokudos};Username=${POSTGRES_USUARIO:?};Password=${POSTGRES_PASSWORD:?}"

      UcoKudos__Identidad__Emisor: ${IDENTIDAD_EMISOR:-}
      UcoKudos__Identidad__Audiencia: ${IDENTIDAD_AUDIENCIA:-}

      UcoKudos__WhatsApp__Proveedor: ${WHATSAPP_PROVEEDOR:-Simulado}
      UcoKudos__WhatsApp__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:-}
      UcoKudos__WhatsApp__VersionGraph: ${WHATSAPP_VERSION_GRAPH:-v23.0}
      UcoKudos__WhatsApp__AccessToken: ${WHATSAPP_ACCESS_TOKEN:-}

      # En local el correo va al contenedor de captura, que no pide usuario ni cifrado.
      UcoKudos__Correo__Proveedor: ${SMTP_PROVEEDOR:-Smtp}
      UcoKudos__Correo__Host: ${SMTP_HOST:-mailpit}
      UcoKudos__Correo__Puerto: ${SMTP_PUERTO:-1025}
      UcoKudos__Correo__Remitente: ${SMTP_REMITENTE:-no-responder@ucokudos.local}
      UcoKudos__Correo__Usuario: ${SMTP_USUARIO:-}
      UcoKudos__Correo__Password: ${SMTP_PASSWORD:-}
      UcoKudos__Correo__UsarTls: ${SMTP_TLS:-false}

      UcoKudos__Push__Asunto: ${VAPID_ASUNTO:-mailto:no-responder@ucokudos.local}
      UcoKudos__Push__ClavePublica: ${VAPID_CLAVE_PUBLICA:-}
      UcoKudos__Push__ClavePrivada: ${VAPID_CLAVE_PRIVADA:-}

      UcoKudos__Objetos__Proveedor: ${OBJETOS_PROVEEDOR:-S3}
      UcoKudos__Objetos__Endpoint: http://objetos:4566
      UcoKudos__Objetos__Contenedor: ${OBJETOS_CONTENEDOR:-adjuntos}
      UcoKudos__Objetos__Usuario: ${OBJETOS_USUARIO:-test}
      UcoKudos__Objetos__Password: ${OBJETOS_PASSWORD:?}

      OTEL_EXPORTER_OTLP_ENDPOINT: http://observabilidad:18889
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ucokudos-api}
    ports:
      - "127.0.0.1:${API_PUERTO:-8082}:8080"

volumes:
  ucokudos-pgdata:
  ucokudos-objetos:
