# Quality gates de ADR-0017. Corren en cada PR hacia develop o main y en cada push a esas ramas.
# Todas bloquean: una puerta que solo informa es documentación, no una puerta.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Para poder relanzarlo a mano sin inventar un commit vacio, por ejemplo despues de anadir un
  # secreto que un job necesita.
  workflow_dispatch:

permissions:
  contents: read

# Un push a main **no cancela** la ejecución que ya está en marcha: esa ejecución puede estar a mitad
# de un despliegue, y cortarlo dejaría la máquina con la versión nueva a medias. Solo se cancelan las
# de los pull requests, que no despliegan nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # El umbral de cobertura del núcleo (ADR-0017) vive en scripts/pruebas-en-contenedor.sh, que
  # es el único lugar donde se define: así local y CI no pueden discrepar.
  # Carpeta de artefactos de compilación, relativa en el runner.
  ARTEFACTOS: artefactos

jobs:
  backend:
    name: Backend (build, formato, pruebas y cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore UcoKudos.slnx

      - name: Compilar sin advertencias (TreatWarningsAsErrors)
        run: dotnet build UcoKudos.slnx --no-restore -c Release

      - name: Formato
        run: dotnet format UcoKudos.slnx --verify-no-changes --no-restore

      # Se invoca el mismo script que en local, donde scripts/pruebas.ps1 lo ejecuta dentro de un
      # contenedor Linux. Así un resultado local y uno del pipeline son comparables y no hay dos
      # juegos de argumentos que mantener de acuerdo.
      - name: Pruebas unitarias con gate de cobertura del núcleo
        run: sh scripts/pruebas-en-contenedor.sh unitarias

      # La regla que solo esta prueba puede verificar es la 4 de ADR-0001: la API referencia la
      # infraestructura para su raíz de composición, así que el compilador no la puede vigilar.
      - name: Pruebas de arquitectura (reglas de ADR-0001)
        run: sh scripts/pruebas-en-contenedor.sh arquitectura

      # Contra PostgreSQL y almacenamiento de objetos reales en contenedores desechables: un doble
      # en memoria no reproduce índices parciales, bloqueos ni la expiración de una URL firmada.
      - name: Pruebas de integración (Testcontainers)
        run: sh scripts/pruebas-en-contenedor.sh integracion

      # Escenarios completos por HTTP: la API entera levantada en memoria, contra PostgreSQL real y
      # con los tres canales simulados. Es el nivel que coge lo que ninguno de los de abajo ve: una
      # ruta que no exige cuenta, un error de dominio que llega como 500, un contrato que cambia.
      - name: Pruebas de extremo a extremo (API completa por HTTP)
        run: sh scripts/pruebas-en-contenedor.sh e2e

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: tests/UcoKudos.UnitTests/TestResults/coverage/
          if-no-files-found: ignore

  secretos:
    name: Escaneo de secretos (ADR-0018)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: un secreto borrado del archivo sigue en el historial.
          fetch-depth: 0

      # Fijada por SHA, no por etiqueta: una etiqueta se puede mover a código distinto (ADR-0017).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerabilidades:
    name: Escaneo de vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trivy lee las dependencias NuGet, también las transitivas, de los *.deps.json de la compilación.
      - name: Compilar para listar las dependencias NuGet
        run: dotnet build UcoKudos.slnx -c Release

      # Bloquea solo lo que tiene corrección disponible: bloquear por algo sin parche detiene el
      # trabajo sin ofrecer salida, y así es como se acaba desactivando la puerta (ADR-0017).
      - name: Dependencias de producción y configuración
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          skip-dirs: tests
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Informe con las dependencias de desarrollo (no bloquea)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          exit-code: '0'
          skip-setup-trivy: true

  calidad:
    name: Análisis estático (Sonar)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: Sonar lo usa para saber qué código es nuevo.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Sin token se omite en lugar de fallar: los PR automáticos de dependencias no reciben secretos.
      - name: Comprobar el token
        id: token
        run: echo "disponible=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Analizar
        if: steps.token.outputs.disponible == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin /k:"jhonnyebc_UcoKudos" /o:"jhonnyebc" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="tests/UcoKudos.UnitTests/TestResults/coverage/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migraciones/**" \
            /d:sonar.coverage.exclusions="src/UcoKudos.Infrastructure/**,src/UcoKudos.Api/**,docker/**"
          dotnet build UcoKudos.slnx -c Release
          dotnet test tests/UcoKudos.UnitTests --no-build -c Release \
            -p:CollectCoverage=true -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput=TestResults/coverage/ -p:Threshold=0
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  imagenes:
    name: Imagen de contenedor (build y Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      etiqueta: ${{ steps.version.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4

      - name: Etiqueta de la imagen (<versión de Directory.Build.props>-<sha corto>)
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "etiqueta=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Construir la imagen de la API
        run: |
          docker build \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            --build-arg REVISION="$GITHUB_SHA" \
            -t "ucokudos-api:${{ steps.version.outputs.etiqueta }}" .

      # Se escanea la imagen que se va a desplegar, no el código que la origina.
      - name: Trivy sobre la imagen
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ucokudos-api:${{ steps.version.outputs.etiqueta }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Se guarda exactamente la imagen escaneada: reconstruirla después invalidaría el escaneo.
      - name: Guardar la imagen escaneada
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: docker save "ucokudos-api:${{ steps.version.outputs.etiqueta }}" | gzip > imagen.tar.gz

      - name: Subir la imagen como artefacto
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: imagen
          path: imagen.tar.gz
          retention-days: 1

  publicar:
    name: Publicar la imagen en el registro
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, secretos, vulnerabilidades, calidad, imagenes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imagen

      - name: Publicar <versión>-<sha> (nunca latest)
        env:
          ETIQUETA: ${{ needs.imagenes.outputs.etiqueta }}
        run: |
          gunzip -c imagen.tar.gz | docker load
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          registro=$(echo "ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag "ucokudos-api:$ETIQUETA" "$registro/ucokudos-api:$ETIQUETA"
          docker push "$registro/ucokudos-api:$ETIQUETA"

  # Despliegue en la máquina (ADR-0016, revisión del 2026-11-13). Solo desde main y solo después de
  # publicar la imagen escaneada: se despliega exactamente lo que pasó todas las puertas.
  desplegar:
    name: Desplegar la API en el servidor
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [imagenes, publicar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion
    # Un despliegue a la vez, y nunca se corta uno en marcha.
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    env:
      CLAVE: ${{ secrets.DESPLIEGUE_SSH_KEY }}
      SERVIDOR: ${{ secrets.DESPLIEGUE_HOST }}
      USUARIO: ${{ secrets.DESPLIEGUE_USUARIO }}
      HUELLA: ${{ secrets.DESPLIEGUE_HUELLA_DEL_SERVIDOR }}
      ETIQUETA: ${{ needs.imagenes.outputs.etiqueta }}
    steps:
      # Sin los secretos no se despliega, y **se dice en voz alta**: un trabajo que se omite en
      # silencio deja la duda de si lo desplegado es lo último. La advertencia queda en el resumen.
      - name: Comprobar que hay con qué desplegar
        id: config
        run: |
          if [ -n "$CLAVE" ] && [ -n "$SERVIDOR" ] && [ -n "$USUARIO" ] && [ -n "$HUELLA" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Despliegue omitido::Faltan secretos del despliegue (DESPLIEGUE_SSH_KEY, DESPLIEGUE_HOST, DESPLIEGUE_USUARIO, DESPLIEGUE_HUELLA_DEL_SERVIDOR). La imagen se publicó pero NO se desplegó. Ver docs/MANUAL-PUESTA-A-PUNTO.md, sección 8.5."
          fi

      # La llave solo puede pedir «desplegar <api|web> <etiqueta>»: en el servidor es una llave de
      # comando forzado (scripts/desplegar-desde-pipeline.sh), sin terminal ni reenvío de puertos.
      # La huella del servidor va fijada: sin ella, un impostor en la red recibiría la orden.
      - name: Desplegar `api` en el servidor
        if: steps.config.outputs.disponible == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HUELLA" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/despliegue \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=20 \
            "$USUARIO@$SERVIDOR" "desplegar api $ETIQUETA"

      - name: Limpiar la llave
        if: always()
        run: rm -f ~/.ssh/despliegue
